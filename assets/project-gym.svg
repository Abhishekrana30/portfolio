<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGym" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#0f0c09"/>
    </linearGradient>
    <linearGradient id="lineGym" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f2a13a"/>
      <stop offset="100%" stop-color="#f2a13a" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bgGym)"/>
  <!-- grid dots -->
  <g fill="rgba(242,161,58,0.12)">
    <circle cx="30" cy="30" r="1.5"/><circle cx="70" cy="30" r="1.5"/><circle cx="110" cy="30" r="1.5"/>
    <circle cx="30" cy="70" r="1.5"/><circle cx="70" cy="70" r="1.5"/><circle cx="110" cy="70" r="1.5"/>
    <circle cx="330" cy="200" r="1.5"/><circle cx="370" cy="200" r="1.5"/><circle cx="330" cy="220" r="1.5"/>
  </g>
  <!-- pose skeleton: person mid-squat with joint markers -->
  <g stroke="url(#lineGym)" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="200" y1="55" x2="200" y2="95"/>
    <line x1="200" y1="95" x2="165" y2="115"/>
    <line x1="165" y1="115" x2="150" y2="150"/>
    <line x1="200" y1="95" x2="235" y2="115"/>
    <line x1="235" y1="115" x2="250" y2="150"/>
    <line x1="200" y1="95" x2="200" y2="150"/>
    <line x1="200" y1="150" x2="170" y2="175"/>
    <line x1="170" y1="175" x2="175" y2="210"/>
    <line x1="200" y1="150" x2="230" y2="175"/>
    <line x1="230" y1="175" x2="225" y2="210"/>
  </g>
  <circle cx="200" cy="42" r="14" fill="none" stroke="#f2a13a" stroke-width="3"/>
  <g fill="#f2a13a">
    <circle cx="200" cy="95" r="4"/>
    <circle cx="165" cy="115" r="4"/><circle cx="150" cy="150" r="4"/>
    <circle cx="235" cy="115" r="4"/><circle cx="250" cy="150" r="4"/>
    <circle cx="200" cy="150" r="4"/>
    <circle cx="170" cy="175" r="4"/><circle cx="175" cy="210" r="4"/>
    <circle cx="230" cy="175" r="4"/><circle cx="225" cy="210" r="4"/>
  </g>
  <!-- correction check badge -->
  <g transform="translate(280,60)">
    <circle r="20" fill="rgba(242,161,58,0.14)" stroke="#f2a13a" stroke-width="1.5"/>
    <path d="M-8,0 L-2,7 L9,-8" stroke="#f2a13a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
